<!DOCTYPE html>
<!-- WEB 200 | Daniel Zubchonak | Form Validation -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WEB 200 Registration Form</title>

    <style>
        label { display: block; }
        .field { margin-bottom: 12px; }
        .field p { margin: 4px 0 0; }
    </style>
</head>
<body>
    <h1>Registration Form</h1>
    <p>All fields are required. Use sample information for this demo.</p>

    <!-- novalidate lets JavaScript show errors under the fields. -->
    <form id="registration-form" method="post" novalidate>
        <div class="field">
            <label for="first-name">First name</label>
            <input id="first-name" type="text" placeholder="Daniel" required>
            <p id="first-name-error"></p>
        </div>

        <div class="field">
            <label for="last-name">Last name</label>
            <input id="last-name" type="text" placeholder="Smith" required>
            <p id="last-name-error"></p>
        </div>

        <!-- The phone pattern requires three digits, a dash, three digits,
             another dash, and four digits. -->
        <div class="field">
            <label for="phone">Phone number</label>
            <input id="phone" type="tel" placeholder="847-555-0134"
                pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" required>
            <p id="phone-error"></p>
        </div>

        <!-- type="email" gives the field a built-in format check. -->
        <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="daniel@example.com" required>
            <p id="email-error"></p>
        </div>

        <div class="field">
            <label for="address">Street address</label>
            <input id="address" type="text" placeholder="123 Main St" required>
            <p id="address-error"></p>
        </div>

        <!-- HTML sets the minimum length. JavaScript checks complexity. -->
        <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password"
                placeholder="Enter a practice password" minlength="8" required>
            <p>Use at least 8 characters, including an uppercase letter,
                a lowercase letter, a number, and a symbol from !@#$%^&amp;*.</p>
            <p id="password-error"></p>
        </div>

        <div class="field">
            <label for="confirm-password">Confirm password</label>
            <input id="confirm-password" type="password"
                placeholder="Repeat your password" required>
            <p id="confirm-password-error"></p>
        </div>

        <button type="submit">Register</button>
    </form>

    <p id="success"></p>

    <!-- Load JavaScript after the form and message paragraphs exist. -->
    <script src="forms.js"></script>
</body>
</html>
